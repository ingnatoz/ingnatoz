<svg xmlns="http://www.w3.org/2000/svg" width="590" height="520" viewBox="0 0 590 520" role="img" aria-label="Highlights. Platform: modular Terraform platform for AWS ECS Fargate. Leadership: tech lead for 5 engineers; archetypes became the standard. Architecture: monolith to microservices for a national TV network. Integrations: 9 marketplaces behind one backend with REST and RabbitMQ.">
