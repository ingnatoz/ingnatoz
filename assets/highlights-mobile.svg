    <text x="92" y="68" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#e8ecf4">Modular Terraform platform for AWS ECS Fargate</text>
    <text x="92" y="92" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9aa3b8">6 reusable modules · one workspace per service</text>
